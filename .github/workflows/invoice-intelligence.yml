name: Invoice Intelligence CI

on:
  push:
    branches:
      - feature/invoice-intelligence
      - feature/ocr-safety-limits
      - feature/invoice-delivery-modes
  pull_request:
    paths:
      - "lib/invoice-intelligence/**"
      - "app/api/invoice-reader/**"
      - "app/api/cron/process-invoices/**"
      - "app/api/companies/**"
      - "app/invoice-review/**"
      - "app/settings/**"
      - "app/en/settings/**"
      - "components/company-delivery-settings.tsx"
      - "tests/invoice-*.test.ts"
      - "scripts/evaluate-invoice-extraction.ts"
      - "lib/schema.ts"
      - "drizzle/**"
      - "package.json"
      - "tsconfig.json"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm check
      - name: Invoice Intelligence tests
        run: pnpm test:invoice
