      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <style>
      .word { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-weight: 800; letter-spacing: -0.02em; }
      .ocr { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-weight: 800; }
    </style>
  </defs>
  <g transform="translate(8 8)">
    <rect width="64" height="64" rx="18" fill="url(#brand)"/>
    <rect x="16" y="9" width="29" height="38" rx="4" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.95" stroke-width="3"/>
    <line x1="22" y1="19" x2="39" y2="19" stroke="#ffffff" stroke-opacity="0.95" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="22" y1="26" x2="39" y2="26" stroke="#ffffff" stroke-opacity="0.95" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="22" y1="33" x2="32" y2="33" stroke="#ffffff" stroke-opacity="0.95" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="44" cy="45" r="12" fill="#1E40AF" stroke="#ffffff" stroke-width="2"/>
    <circle cx="44" cy="45" r="5" fill="#ffffff" fill-opacity="0.95"/>
    <circle cx="47" cy="42" r="1.6" fill="#ffffff"/>
    <rect x="12" y="51" width="34" height="11" rx="5.5" fill="#ffffff"/>
